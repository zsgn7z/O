
name: Cloud Android Phone

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-android:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Install Remote Desktop Tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            x11vnc \
            novnc \
            websockify \
            scrcpy \
            curl \
            wget

          mkdir -p "$RUNNER_TEMP/cloud-android"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "SDK Manager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

      - name: Accept Android Licenses
        shell: bash
        run: |
          set -e
          "$SDKMANAGER" --licenses < /dev/null

      - name: Install Android Components
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" --install \
            "platform-tools" \
            "emulator" \
            "platforms;android-35" \
            "system-images;android-35;google_apis;x86_64"

      - name: Create Android Phone
        shell: bash
        run: |
          set -e

          echo "no" | avdmanager create avd \
            --force \
            -n CloudPhone \
            -k "system-images;android-35;google_apis;x86_64" \
            -d pixel_2

      - name: Start Virtual Display
        shell: bash
        run: |
          nohup Xvfb :0 \
            -screen 0 1280x900x24 \
            -ac \
            > "$RUNNER_TEMP/cloud-android/xvfb.log" 2>&1 &

          sleep 3

      - name: Start Android Emulator
        shell: bash
        run: |
          set -e

          nohup emulator \
            -avd CloudPhone \
            -port 5554 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -memory 2048 \
            -cores 2 \
            > "$RUNNER_TEMP/cloud-android/emulator.log" 2>&1 \
            < /dev/null &

          echo "Emulator started"

      - name: Wait for Android
        shell: bash
        run: |
          set -e

          adb start-server

          CONNECTED=0

          for i in {1..60}; do
            if adb devices | grep -q "emulator-5554.*device$"; then
              CONNECTED=1
              break
            fi

            echo "Waiting for emulator: $i/60"
            sleep 5
          done

          if [ "$CONNECTED" -ne 1 ]; then
            echo "Emulator connection failed"
            cat "$RUNNER_TEMP/cloud-android/emulator.log"
            exit 1
          fi

          BOOT=0

          for i in {1..60}; do
            VALUE=$(adb -s emulator-5554 shell \
              getprop sys.boot_completed 2>/dev/null | tr -d '\r')

            if [ "$VALUE" = "1" ]; then
              BOOT=1
              break
            fi

            sleep 5
          done

          if [ "$BOOT" -ne 1 ]; then
            echo "Android boot failed"
            cat "$RUNNER_TEMP/cloud-android/emulator.log"
            exit 1
          fi

          echo "Android successfully started"

      - name: Start Android Display
        shell: bash
        run: |
          export DISPLAY=:0

          nohup scrcpy \
            --no-audio \
            --max-size=1280 \
            --video-bit-rate=4M \
            > "$RUNNER_TEMP/cloud-android/scrcpy.log" 2>&1 &

          sleep 5

      - name: Start VNC Server
        shell: bash
        run: |
          nohup x11vnc \
            -display :0 \
            -localhost \
            -forever \
            -shared \
            -nopw \
            -rfbport 5900 \
            > "$RUNNER_TEMP/cloud-android/vnc.log" 2>&1 &

          sleep 3

          nohup websockify \
            --web=/usr/share/novnc \
            127.0.0.1:6080 \
            127.0.0.1:5900 \
            > "$RUNNER_TEMP/cloud-android/websockify.log" 2>&1 &

          sleep 3

      - name: Connect Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        shell: bash
        run: |
          set -e

          if [ -z "$TS_AUTHKEY" ]; then
            echo "Missing TAILSCALE_AUTH_KEY secret"
            exit 1
          fi

          curl -fsSL https://tailscale.com/install.sh | sh

          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="cloud-android-$GITHUB_RUN_ID" \
            --accept-dns=false

          sudo tailscale serve --bg 6080

          sudo tailscale serve status

      - name: Verify Android and Remote Screen
        shell: bash
        run: |
          set -e

          adb devices
          adb shell getprop ro.build.version.release

          curl -f http://127.0.0.1:6080/vnc.html

          sudo tailscale status
          sudo tailscale serve status

          echo "Cloud Android services started"

      - name: Keep Cloud Phone Running
        shell: bash
        run: |
          for i in {1..65}; do
            echo "Cloud Android active: $i"
            adb devices
            sleep 300
          done

      - name: Upload Diagnostic Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-android-logs
          path: ${{ runner.temp }}/cloud-android/
          if-no-files-found: warn
          retention-days: 1
