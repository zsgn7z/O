
name: Cloud Android Phone

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      DISPLAY: :0

    steps:
      - name: Install Remote Desktop Tools
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc novnc websockify curl

          mkdir -p "$RUNNER_TEMP/cloud-android"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Locate Android SDK Tools
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          AVDMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name avdmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ] || [ -z "$AVDMANAGER" ]; then
            echo "Android command line tools missing"
            find "$ANDROID_HOME/cmdline-tools" -type f
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "AVDMANAGER=$AVDMANAGER" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

          echo "SDK tools located"

      - name: Install Android x86_64 Image
        shell: bash
        run: |
          set -e
          set +o pipefail

          yes 2>/dev/null | "$SDKMANAGER" --install \
            "platform-tools" \
            "emulator" \
            "platforms;android-35" \
            "system-images;android-35;google_apis;x86_64"

          echo "Checking installed image"

          IMAGE="$ANDROID_HOME/system-images/android-35/google_apis/x86_64"

          if [ ! -d "$IMAGE" ]; then
            echo "x86_64 image not found"
            exit 1
          fi

          echo "x86_64 image installed"

      - name: Verify Runner Architecture
        shell: bash
        run: |
          set -e

          echo "Runner architecture:"
          uname -m

          echo "Emulator version:"
          emulator -version

          echo "Available system images:"
          find "$ANDROID_HOME/system-images" -maxdepth 4 -type d

      - name: Create Android Virtual Device
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android/avd"

          echo "no" | "$AVDMANAGER" create avd \
            --force \
            -n CloudPhone \
            -k "system-images;android-35;google_apis;x86_64" \
            -d pixel_2

          echo "Checking AVD configuration"

          cat "$HOME/.android/avd/CloudPhone.avd/config.ini"

          grep -q "x86_64" \
            "$HOME/.android/avd/CloudPhone.avd/config.ini"

      - name: Start Virtual Display
        shell: bash
        run: |
          set -e

          nohup Xvfb :0 \
            -screen 0 1280x900x24 \
            -ac \
            > "$RUNNER_TEMP/cloud-android/xvfb.log" 2>&1 &

          sleep 3

      - name: Start Android Emulator
        shell: bash
        run: |
          set -e

          nohup emulator \
            -avd CloudPhone \
            -port 5554 \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -no-window \
            -gpu swiftshader_indirect \
            -accel off \
            -memory 2048 \
            -cores 2 \
            > "$RUNNER_TEMP/cloud-android/emulator.log" 2>&1 \
            < /dev/null &

          echo "Emulator launched"

          sleep 10

          cat "$RUNNER_TEMP/cloud-android/emulator.log"

      - name: Wait for Android Boot
        shell: bash
        run: |
          set -e

          adb start-server

          CONNECTED=0

          for i in {1..60}; do
            if adb devices | grep -q "emulator-5554.*device$"; then
              CONNECTED=1
              break
            fi

            echo "Waiting for Android: $i/60"
            sleep 5
          done

          if [ "$CONNECTED" -ne 1 ]; then
            echo "Android emulator failed to connect"
            cat "$RUNNER_TEMP/cloud-android/emulator.log"
            exit 1
          fi

          BOOT=0

          for i in {1..60}; do
            VALUE=$(adb -s emulator-5554 shell \
              getprop sys.boot_completed 2>/dev/null | tr -d '\r')

            if [ "$VALUE" = "1" ]; then
              BOOT=1
              break
            fi

            echo "Waiting for Android boot: $i/60"
            sleep 5
          done

          if [ "$BOOT" -ne 1 ]; then
            echo "Android boot timed out"
            exit 1
          fi

          echo "Android started successfully"

      - name: Start Android Screen
        shell: bash
        run: |
          set -e

          nohup emulator \
            -avd CloudPhone \
            -port 5556 \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -accel off \
            -memory 2048 \
            -cores 2 \
            > "$RUNNER_TEMP/cloud-android/display.log" 2>&1 \
            < /dev/null &

      - name: Start VNC Server
        shell: bash
        run: |
          set -e

          nohup x11vnc \
            -display :0 \
            -localhost \
            -forever \
            -shared \
            -nopw \
            -rfbport 5900 \
            > "$RUNNER_TEMP/cloud-android/vnc.log" 2>&1 &

          sleep 3

          nohup websockify \
            --web=/usr/share/novnc \
            127.0.0.1:6080 \
            127.0.0.1:5900 \
            > "$RUNNER_TEMP/cloud-android/websockify.log" 2>&1 &

          sleep 3

          curl -f http://127.0.0.1:6080/vnc.html

      - name: Connect Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        shell: bash
        run: |
          set -e

          if [ -z "$TS_AUTHKEY" ]; then
            echo "TAILSCALE_AUTH_KEY secret missing"
            exit 1
          fi

          curl -fsSL https://tailscale.com/install.sh | sh

          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="cloud-android-$GITHUB_RUN_ID" \
            --accept-dns=false

          sudo tailscale serve --bg 6080

          sudo tailscale serve status

      - name: Verify Services
        shell: bash
        run: |
          set -e

          echo "Android version:"
          adb shell getprop ro.build.version.release

          echo "Android devices:"
          adb devices

          echo "Remote screen:"
          curl -f http://127.0.0.1:6080/vnc.html

          echo "Tailscale:"
          sudo tailscale status

      - name: Keep Cloud Phone Running
        shell: bash
        run: |
          for i in {1..65}; do
            echo "Cloud Android active: $i/65"
            sleep 300
          done

      - name: Upload Diagnostic Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-android-logs
          path: ${{ runner.temp }}/cloud-android/
          if-no-files-found: warn
          retention-days: 1
