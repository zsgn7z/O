
name: Android Virtual Device

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

      - name: Check SDK
        shell: bash
        run: |
          echo "SDK: $ANDROID_HOME"
          ls -la "$ANDROID_HOME/cmdline-tools/"
          ls -la "$ANDROID_HOME/cmdline-tools/latest/bin/"

      - name: Accept SDK Licenses
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          for i in {1..20}; do
            echo "y"
          done | "$SDKMANAGER" --licenses

      - name: Install Android Components
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "emulator" \
            "platforms;android-35" \
            "system-images;android-35;google_apis;x86_64"

      - name: Create Android Device
        shell: bash
        run: |
          echo "no" | avdmanager create avd \
            -n AndroidDevice \
            -k "system-images;android-35;google_apis;x86_64" \
            -d pixel_2

      - name: Start Android Emulator
        shell: bash
        run: |
          nohup emulator \
            -avd AndroidDevice \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -memory 4096 \
            -cores 2 \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &

      - name: Wait for Android Boot
        shell: bash
        run: |
          adb wait-for-device

          BOOT=""
          for i in {1..60}; do
            BOOT=$(adb shell getprop sys.boot_completed | tr -d '\r')

            if [ "$BOOT" = "1" ]; then
              echo "Android started successfully"
              break
            fi

            sleep 5
          done

          if [ "$BOOT" != "1" ]; then
            echo "Android boot failed"
            cat "$RUNNER_TEMP/emulator.log"
            exit 1
          fi

      - name: Android Information
        shell: bash
        run: |
          adb devices
          adb shell getprop ro.build.version.release
          adb shell getprop ro.product.model
          adb shell df -h

      - name: Keep Android Running
        shell: bash
        run: |
          for i in {1..65}; do
            echo "Android running: $i"
            adb shell getprop sys.boot_completed
            sleep 300
          done

      - name: Upload Android Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-logs
          path: ${{ runner.temp }}/emulator.log
          if-no-files-found: warn
          retention-days: 1
