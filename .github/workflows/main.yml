
name: Cloud Android Phone

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-android:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      DISPLAY: :0

    steps:
      # 1. Install screen and remote-control tools
      - name: Install Remote Desktop Tools
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc novnc websockify scrcpy curl

          mkdir -p "$RUNNER_TEMP/cloud-android"

      # 2. Set up Android SDK and accept licenses
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 3. Find SDK tools
      - name: Configure Android Tools
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            find "$ANDROID_HOME" -name sdkmanager
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

          echo "Found SDK Manager: $SDKMANAGER"

      # 4. Install emulator and Android system image
      - name: Install Android Components
        shell: bash
        run: |
          set -e
          set +o pipefail

          yes 2>/dev/null | "$SDKMANAGER" --install \
            "platform-tools" \
            "emulator" \
            "platforms;android-35" \
            "system-images;android-35;google_apis;x86_64"

      # 5. Create virtual phone without avdmanager
      - name: Create Android Phone
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android/avd/CloudPhone.avd"

          cat > "$HOME/.android/avd/CloudPhone.ini" <<EOF
          avd.ini.encoding=UTF-8
          path=$HOME/.android/avd/CloudPhone.avd
          path.rel=avd/CloudPhone.avd
          target=android-35
          EOF

          cat > "$HOME/.android/avd/CloudPhone.avd/config.ini" <<'EOF'
          AvdId=CloudPhone
          avd.ini.displayname=CloudPhone
          abi.type=x86_64
          image.sysdir.1=system-images/android-35/google_apis/x86_64/
          hw.device.name=pixel_2
          hw.device.manufacturer=Google
          hw.cpu.ncore=2
          hw.ramSize=2048
          hw.lcd.width=1080
          hw.lcd.height=1920
          hw.lcd.density=420
          hw.keyboard=yes
          hw.gpu.enabled=yes
          hw.gpu.mode=swiftshader_indirect
          showDeviceFrame=no
          fastboot.chosenSnapshotFile=
          fastboot.forceColdBoot=yes
          EOF

          echo "CloudPhone configuration created"

      # 6. Start virtual screen
      - name: Start Virtual Display
        shell: bash
        run: |
          set -e

          nohup Xvfb :0 \
            -screen 0 1280x900x24 \
            -ac \
            > "$RUNNER_TEMP/cloud-android/xvfb.log" 2>&1 &

          sleep 3

      # 7. Start Android
      - name: Start Android Emulator
        shell: bash
        run: |
          set -e

          nohup emulator \
            -avd CloudPhone \
            -port 5554 \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -no-window \
            -gpu swiftshader_indirect \
            -memory 2048 \
            -cores 2 \
            > "$RUNNER_TEMP/cloud-android/emulator.log" 2>&1 \
            < /dev/null &

          adb start-server

      # 8. Wait until Android is ready
      - name: Wait for Android Boot
        shell: bash
        run: |
          set -e

          CONNECTED=0

          for i in {1..60}; do
            if adb devices | grep -q "emulator-5554.*device$"; then
              CONNECTED=1
              break
            fi

            echo "Waiting for emulator: $i/60"
            sleep 5
          done

          if [ "$CONNECTED" -ne 1 ]; then
            echo "Emulator did not connect"
            cat "$RUNNER_TEMP/cloud-android/emulator.log"
            exit 1
          fi

          BOOT=0

          for i in {1..60}; do
            VALUE=$(adb -s emulator-5554 shell \
              getprop sys.boot_completed 2>/dev/null | tr -d '\r')

            if [ "$VALUE" = "1" ]; then
              BOOT=1
              break
            fi

            echo "Waiting for Android boot: $i/60"
            sleep 5
          done

          if [ "$BOOT" -ne 1 ]; then
            echo "Android boot timed out"
            cat "$RUNNER_TEMP/cloud-android/emulator.log"
            exit 1
          fi

          echo "Android is ready"

      # 9. Display Android using scrcpy
      - name: Start Android Screen
        shell: bash
        run: |
          set -e

          nohup scrcpy \
            --serial emulator-5554 \
            --no-audio \
            --max-size 1280 \
            --video-bit-rate 4M \
            > "$RUNNER_TEMP/cloud-android/scrcpy.log" 2>&1 \
            < /dev/null &

          sleep 5

      # 10. Start remote screen server
      - name: Start VNC and noVNC
        shell: bash
        run: |
          set -e

          nohup x11vnc \
            -display :0 \
            -localhost \
            -forever \
            -shared \
            -nopw \
            -rfbport 5900 \
            > "$RUNNER_TEMP/cloud-android/vnc.log" 2>&1 &

          sleep 3

          nohup websockify \
            --web=/usr/share/novnc \
            127.0.0.1:6080 \
            127.0.0.1:5900 \
            > "$RUNNER_TEMP/cloud-android/websockify.log" 2>&1 &

          sleep 3

          curl -f http://127.0.0.1:6080/vnc.html

      # 11. Connect Tailscale
      - name: Connect Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        shell: bash
        run: |
          set -e

          if [ -z "$TS_AUTHKEY" ]; then
            echo "TAILSCALE_AUTH_KEY secret is missing"
            exit 1
          fi

          curl -fsSL https://tailscale.com/install.sh | sh

          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="cloud-android-$GITHUB_RUN_ID" \
            --accept-dns=false

          sudo tailscale serve --bg 6080

          sudo tailscale serve status

      # 12. Verify services
      - name: Verify Cloud Android
        shell: bash
        run: |
          set -e

          echo "Checking Android..."
          adb devices
          adb shell getprop ro.build.version.release

          echo "Checking noVNC..."
          curl -f http://127.0.0.1:6080/vnc.html

          echo "Checking Tailscale..."
          sudo tailscale status
          sudo tailscale serve status

          echo "Cloud Android started"

      # 13. Keep session alive
      - name: Keep Cloud Phone Running
        shell: bash
        run: |
          for i in {1..65}; do
            echo "Cloud Android running: $i/65"
            sleep 300
          done

      # 14. Save logs if anything fails
      - name: Upload Diagnostic Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-android-logs
          path: ${{ runner.temp }}/cloud-android/
          if-no-files-found: warn
          retention-days: 1

