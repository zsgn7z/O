
name: Cloud Android Phone

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      DISPLAY: :0

    steps:
      - name: Install Dependencies
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            xvfb x11vnc novnc websockify curl wget \
            libpulse0 libasound2t64 libnss3 libnspr4 \
            libx11-6 libx11-xcb1 libxcb1 libxcb-cursor0 \
            libxcb-xinerama0 libxcb-xkb1 libxcb-xinput0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-randr0 libxcb-sync1 libxcb-util1 \
            libxkbcommon0 libxkbcommon-x11-0 libxkbfile1 \
            libxshmfence1 libxcursor1 libxdamage1 libxfixes3 \
            libxinerama1 libxss1 libxi6 libxtst6 libxrandr2 \
            libxrender1 libxcomposite1 libxext6 libglib2.0-0 \
            libstdc++6 libgcc-s1 libfontconfig1 libfreetype6 \
            libdbus-1-3 libdrm2 libgbm1 libgl1 libegl1 \
            libvulkan1 libudev1 libbsd0 libmd0 libatomic1 libunwind8

          mkdir -p "$RUNNER_TEMP/cloud-android"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Configure Android Tools
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          AVDMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name avdmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ] || [ -z "$AVDMANAGER" ]; then
            echo "Android SDK tools not found"
            find "$ANDROID_HOME/cmdline-tools" -type f
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "AVDMANAGER=$AVDMANAGER" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

      - name: Accept Android Licenses
        shell: bash
        run: |
          set -e
          set +o pipefail
          yes 2>/dev/null | "$SDKMANAGER" --licenses

      - name: Install Android Components
        shell: bash
        run: |
          set -e
          set +o pipefail

          yes 2>/dev/null | "$SDKMANAGER" --install \
            "platform-tools" \
            "emulator" \
            "platforms;android-35" \
            "system-images;android-35;google_apis;x86_64"

          IMAGE="$ANDROID_HOME/system-images/android-35/google_apis/x86_64"
          test -d "$IMAGE" || {
            echo "Android x86_64 image missing"
            exit 1
          }

      - name: Check Emulator Libraries
        shell: bash
        run: |
          set -e

          echo "Runner architecture:"
          uname -m

          if [ "$(uname -m)" != "x86_64" ]; then
            echo "Expected x86_64 runner"
            exit 1
          fi

          QEMU="$ANDROID_HOME/emulator/qemu/linux-x86_64/qemu-system-x86_64"
          EMULATOR="$ANDROID_HOME/emulator/emulator"

          for BIN in "$EMULATOR" "$QEMU"; do
            echo "Checking $BIN"
            test -x "$BIN" || {
              echo "Executable not found"
              exit 1
            }
            ldd "$BIN" || true
          done | tee "$RUNNER_TEMP/cloud-android/dependencies.log"

          echo "Missing libraries:"
          grep "not found" "$RUNNER_TEMP/cloud-android/dependencies.log" || true

      # FIXED: Explicit AVD directory and verified config location
      - name: Create Android Phone
        shell: bash
        run: |
          set -e

          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"

          echo "Creating CloudPhone..."

          printf 'no\n' | "$AVDMANAGER" create avd \
            --force \
            -n CloudPhone \
            -k "system-images;android-35;google_apis;x86_64" \
            -d pixel_2

          echo "Available virtual devices:"
          "$AVDMANAGER" list avd

          CONFIG="$ANDROID_AVD_HOME/CloudPhone.avd/config.ini"

          if [ ! -f "$CONFIG" ]; then
            echo "ERROR: CloudPhone config.ini was not created."
            echo "Searching for AVD files..."
            find "$HOME/.android" -maxdepth 5 -type f -print || true
            exit 1
          fi

          echo "AVD configuration:"
          cat "$CONFIG"

          if ! grep -q "abi.type=x86_64" "$CONFIG"; then
            echo "Wrong AVD architecture"
            exit 1
          fi

          echo "CloudPhone created successfully"

      - name: Start Virtual Display
        shell: bash
        run: |
          set -e

          nohup Xvfb :0 \
            -screen 0 1280x900x24 \
            -ac \
            > "$RUNNER_TEMP/cloud-android/xvfb.log" 2>&1 &

          sleep 3

      - name: Start Android Emulator
        shell: bash
        run: |
          set -e

          nohup emulator \
            -avd CloudPhone \
            -port 5554 \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -memory 2048 \
            -cores 2 \
            > "$RUNNER_TEMP/cloud-android/emulator.log" 2>&1 \
            < /dev/null &

          sleep 10
          cat "$RUNNER_TEMP/cloud-android/emulator.log"

      - name: Wait for Android Boot
        shell: bash
        run: |
          set -e

          adb start-server
          CONNECTED=0

          for i in {1..60}; do
            if adb devices | grep -q "emulator-5554.*device$"; then
              CONNECTED=1
              break
            fi
            echo "Waiting for Android: $i/60"
            sleep 5
          done

          if [ "$CONNECTED" -ne 1 ]; then
            echo "Emulator did not connect"
            cat "$RUNNER_TEMP/cloud-android/emulator.log"
            exit 1
          fi

          BOOT=0

          for i in {1..60}; do
            VALUE=$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$VALUE" = "1" ]; then
              BOOT=1
              break
            fi
            echo "Waiting for Android boot: $i/60"
            sleep 5
          done

          if [ "$BOOT" -ne 1 ]; then
            echo "Android boot timed out"
            cat "$RUNNER_TEMP/cloud-android/emulator.log"
            exit 1
          fi

          echo "Android boot completed"

      - name: Verify Android
        shell: bash
        run: |
          set -e
          echo "Android version:"
          adb shell getprop ro.build.version.release
          echo "Android model:"
          adb shell getprop ro.product.model
          echo "Android display:"
          adb shell wm size

      - name: Start Remote Screen
        shell: bash
        run: |
          set -e

          nohup x11vnc \
            -display :0 \
            -localhost \
            -forever \
            -shared \
            -nopw \
            -rfbport 5900 \
            > "$RUNNER_TEMP/cloud-android/vnc.log" 2>&1 &

          sleep 3

          nohup websockify \
            --web=/usr/share/novnc \
            127.0.0.1:6080 \
            127.0.0.1:5900 \
            > "$RUNNER_TEMP/cloud-android/websockify.log" 2>&1 &

          sleep 3
          curl -f http://127.0.0.1:6080/vnc.html

          echo "Remote screen started"

      - name: Connect Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        shell: bash
        run: |
          set -e

          if [ -z "$TS_AUTHKEY" ]; then
            echo "TAILSCALE_AUTH_KEY secret is missing"
            exit 1
          fi

          curl -fsSL https://tailscale.com/install.sh | sh

          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="cloud-android-$GITHUB_RUN_ID" \
            --accept-dns=false

          sudo tailscale serve --bg 6080
          sudo tailscale status
          sudo tailscale serve status

      - name: Verify Cloud Android
        shell: bash
        run: |
          set -e
          adb devices
          curl -f http://127.0.0.1:6080/vnc.html
          sudo tailscale serve status
          echo "Cloud Android services started"

      - name: Keep Cloud Phone Running
        shell: bash
        run: |
          for i in {1..65}; do
            echo "Cloud Android active: $i/65"
            sleep 300
          done

      - name: Upload Diagnostic Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-android-logs
          path: ${{ runner.temp }}/cloud-android/
          if-no-files-found: warn
          retention-days: 1
