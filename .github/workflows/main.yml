
name: Cloud Android Phone

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      DISPLAY: :0

    steps:
      # 1. Install required Linux libraries
      - name: Install Dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            xvfb \
            x11vnc \
            novnc \
            websockify \
            curl \
            wget \
            libpulse0 \
            libasound2t64 \
            libnss3 \
            libx11-6 \
            libxcb1 \
            libxcomposite1 \
            libxcursor1 \
            libxi6 \
            libxtst6 \
            libxrandr2 \
            libxrender1 \
            libxkbcommon0 \
            libglib2.0-0 \
            libstdc++6 \
            libgcc-s1 \
            libfontconfig1 \
            libdbus-1-3 \
            libdrm2 \
            libgbm1

          mkdir -p "$RUNNER_TEMP/cloud-android"

      # 2. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 3. Locate SDK tools
      - name: Configure Android Tools
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          AVDMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name avdmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ] || [ -z "$AVDMANAGER" ]; then
            echo "Android SDK tools not found"
            find "$ANDROID_HOME/cmdline-tools" -type f
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "AVDMANAGER=$AVDMANAGER" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

          echo "SDK tools found"

      # 4. Accept licenses
      - name: Accept Android Licenses
        shell: bash
        run: |
          set -e
          set +o pipefail

          yes 2>/dev/null | "$SDKMANAGER" --licenses

          echo "Android licenses accepted"

      # 5. Install Android x86_64
      - name: Install Android Components
        shell: bash
        run: |
          set -e
          set +o pipefail

          yes 2>/dev/null | "$SDKMANAGER" --install \
            "platform-tools" \
            "emulator" \
            "platforms;android-35" \
            "system-images;android-35;google_apis;x86_64"

          IMAGE="$ANDROID_HOME/system-images/android-35/google_apis/x86_64"

          if [ ! -d "$IMAGE" ]; then
            echo "Android x86_64 image missing"
            exit 1
          fi

          echo "Android image installed"

      # 6. Check architecture and libraries
      - name: Check Emulator Architecture and Libraries
        shell: bash
        run: |
          set -e

          echo "Runner architecture:"
          uname -m

          if [ "$(uname -m)" != "x86_64" ]; then
            echo "This workflow requires x86_64"
            exit 1
          fi

          QEMU="$ANDROID_HOME/emulator/qemu/linux-x86_64/qemu-system-x86_64"

          for BIN in "$ANDROID_HOME/emulator/emulator" "$QEMU"; do
            if [ ! -x "$BIN" ]; then
              echo "Missing executable: $BIN"
              exit 1
            fi

            echo "Checking: $BIN"
            ldd "$BIN"
          done | tee "$RUNNER_TEMP/cloud-android/dependencies.log"

          if grep -q "not found" "$RUNNER_TEMP/cloud-android/dependencies.log"; then
            echo "Missing shared libraries"
            exit 1
          fi

          echo "Emulator dependencies checked"

      # 7. Create Android phone
      - name: Create Android Phone
        shell: bash
        run: |
          set -e

          echo "no" | "$AVDMANAGER" create avd \
            --force \
            -n CloudPhone \
            -k "system-images;android-35;google_apis;x86_64" \
            -d pixel_2

          CONFIG="$HOME/.android/avd/CloudPhone.avd/config.ini"

          echo "AVD configuration:"
          cat "$CONFIG"

          if ! grep -q "abi.type=x86_64" "$CONFIG"; then
            echo "Wrong emulator architecture"
            exit 1
          fi

          echo "CloudPhone created"

      # 8. Start virtual screen
      - name: Start Virtual Display
        shell: bash
        run: |
          set -e

          nohup Xvfb :0 \
            -screen 0 1280x900x24 \
            -ac \
            > "$RUNNER_TEMP/cloud-android/xvfb.log" 2>&1 &

          sleep 3

      # 9. Start ONE Android emulator with its GUI
      - name: Start Android Emulator
        shell: bash
        run: |
          set -e

          nohup emulator \
            -avd CloudPhone \
            -port 5554 \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -memory 2048 \
            -cores 2 \
            > "$RUNNER_TEMP/cloud-android/emulator.log" 2>&1 \
            < /dev/null &

          echo "Android emulator launched"

          sleep 10

          cat "$RUNNER_TEMP/cloud-android/emulator.log"

      # 10. Wait for Android
      - name: Wait for Android Boot
        shell: bash
        run: |
          set -e

          adb start-server

          CONNECTED=0

          for i in {1..60}; do
            if adb devices | grep -q "emulator-5554.*device$"; then
              CONNECTED=1
              break
            fi

            echo "Waiting for Android: $i/60"
            sleep 5
          done

          if [ "$CONNECTED" -ne 1 ]; then
            echo "Android did not connect"
            cat "$RUNNER_TEMP/cloud-android/emulator.log"
            exit 1
          fi

          BOOT=0

          for i in {1..60}; do
            VALUE=$(adb -s emulator-5554 shell \
              getprop sys.boot_completed 2>/dev/null | tr -d '\r')

            if [ "$VALUE" = "1" ]; then
              BOOT=1
              break
            fi

            echo "Waiting for Android boot: $i/60"
            sleep 5
          done

          if [ "$BOOT" -ne 1 ]; then
            echo "Android boot timed out"
            cat "$RUNNER_TEMP/cloud-android/emulator.log"
            exit 1
          fi

          echo "Android boot completed"

      # 11. Verify Android screen
      - name: Check Android Display
        shell: bash
        run: |
          set -e

          echo "Android version:"
          adb shell getprop ro.build.version.release

          echo "Android model:"
          adb shell getprop ro.product.model

          echo "Android screen:"
          adb shell wm size

          echo "Android is ready"

      # 12. Start VNC
      - name: Start VNC Server
        shell: bash
        run: |
          set -e

          nohup x11vnc \
            -display :0 \
            -localhost \
            -forever \
            -shared \
            -nopw \
            -rfbport 5900 \
            > "$RUNNER_TEMP/cloud-android/vnc.log" 2>&1 &

          sleep 3

          nohup websockify \
            --web=/usr/share/novnc \
            127.0.0.1:6080 \
            127.0.0.1:5900 \
            > "$RUNNER_TEMP/cloud-android/websockify.log" 2>&1 &

          sleep 3

          curl -f http://127.0.0.1:6080/vnc.html

          echo "Remote screen services started"

      # 13. Connect Tailscale
      - name: Connect Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        shell: bash
        run: |
          set -e

          if [ -z "$TS_AUTHKEY" ]; then
            echo "TAILSCALE_AUTH_KEY secret is missing"
            exit 1
          fi

          curl -fsSL https://tailscale.com/install.sh | sh

          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="cloud-android-$GITHUB_RUN_ID" \
            --accept-dns=false

          sudo tailscale serve --bg 6080

          echo "Tailscale status:"
          sudo tailscale status

          echo "Serve status:"
          sudo tailscale serve status

      # 14. Final verification
      - name: Verify Cloud Android
        shell: bash
        run: |
          set -e

          echo "Checking Android..."
          adb devices

          echo "Checking remote screen..."
          curl -f http://127.0.0.1:6080/vnc.html

          echo "Checking Tailscale..."
          sudo tailscale serve status

          echo "Cloud Android checks completed"

      # 15. Keep session alive
      - name: Keep Cloud Phone Running
        shell: bash
        run: |
          for i in {1..65}; do
            echo "Cloud Android running: $i/65"
            sleep 300
          done

      # 16. Save logs
      - name: Upload Diagnostic Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-android-logs
          path: ${{ runner.temp }}/cloud-android/
          if-no-files-found: warn
          retention-days: 1
